name: Weekly ERC re-ingest

on:
  schedule:
    # Every Monday 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  reingest:
    name: Re-ingest ERC catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify ingestion script exists
        run: |
          if [ ! -f scripts/ingest_ercs.py ]; then
            echo "::error file=scripts/ingest_ercs.py::scripts/ingest_ercs.py is missing — the weekly re-ingest cannot run"
            exit 1
          fi

      - name: Install Python dependencies
        run: python -m pip install --quiet requests

      - name: Run ERC catalog ingestion
        run: python scripts/ingest_ercs.py

      - name: Detect catalog changes
        id: diff
        run: |
          if git diff --quiet -- src/data/catalog.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "src/data/catalog.json unchanged — no PR needed."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo 'summary<<SUMMARY_EOF'
              git diff --stat -- src/data/catalog.json scripts/erc_curation.json docs/ingestion.md
              echo 'SUMMARY_EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: |
            src/data/catalog.json
            scripts/erc_curation.json
            docs/ingestion.md
          branch: chore/weekly-erc-reingest
          delete-branch: true
          commit-message: 'chore: weekly ERC catalog re-ingest'
          title: 'chore: weekly ERC catalog re-ingest'
          labels: automated
          body: |
            Automated weekly re-ingestion of the ERC catalog from `ethereum/ERCs`
            (+ EIP supplements), scheduled every Monday 06:00 UTC
            (`.github/workflows/reingest.yml`).

            ### What changed

            ```
            ${{ steps.diff.outputs.summary }}
            ```

            `published` / `tier` values and the curated draft/stagnant lists are
            preserved across runs per the ingestion idempotency rules
            (plan §8.1.5, ADR 005).

            Review checklist:

            - [ ] New / changed catalog rows look sane (status, category, inclusion)
            - [ ] `python scripts/validate_registry.py` passes on this branch
